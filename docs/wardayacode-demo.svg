<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
  </defs>

  <!-- Terminal window background -->
  <rect x="0" y="0" width="720" height="400" rx="10" fill="#1e1e2e"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="720" height="36" rx="10" fill="#181825"/>
  <rect x="0" y="20" width="720" height="16" fill="#181825"/>

  <!-- Window dots -->
  <circle cx="20" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="18" r="6" fill="#fab387"/>
  <circle cx="60" cy="18" r="6" fill="#a6e3a1"/>

  <!-- Terminal title -->
  <text x="360" y="24" text-anchor="middle" fill="#6c7086" font-size="11">wardayacode — ~/my-project</text>

  <!-- Session output area -->
  <!-- Line 1: system message -->
  <text x="20" y="64" fill="#6c7086" font-size="12">[system] WardayaCode v0.6.0 · Anthropic · claude-sonnet-4</text>

  <!-- Line 2-3: user message -->
  <text x="20" y="90" fill="#89b4fa" font-size="12">❯</text>
  <text x="36" y="90" fill="#cdd6f4" font-size="12">Explain the architecture of this project</text>

  <!-- Line 4: tool call -->
  <text x="20" y="116" fill="#cba6f7" font-size="12">● read_file(package.json)</text>
  <text x="20" y="132" fill="#6c7086" font-size="12">✓ 87 lines</text>

  <!-- Line 5: tool call -->
  <text x="20" y="158" fill="#cba6f7" font-size="12">● glob(src/**/*.ts)</text>
  <text x="20" y="174" fill="#6c7086" font-size="12">✓ 42 files matched</text>

  <!-- Line 6: tool call -->
  <text x="20" y="200" fill="#cba6f7" font-size="12">● read_file(src/cli.ts)</text>
  <text x="20" y="216" fill="#6c7086" font-size="12">✓ 145 lines</text>

  <!-- Line 7: assistant response -->
  <text x="20" y="248" fill="#cdd6f4" font-size="12">This project follows a layered architecture:</text>
  <text x="20" y="268" fill="#cdd6f4" font-size="12">• Aki Tokens — ERC-20 token contract</text>
  <text x="20" y="284" fill="#cdd6f4" font-size="12">• Aki Markets — trading infrastructure</text>
  <text x="20" y="300" fill="#cdd6f4" font-size="12">• Aki Governance — DAO voting</text>

  <!-- Input bar -->
  <rect x="10" y="340" width="700" height="38" rx="6" fill="#313244"/>
  <text x="26" y="365" fill="#89b4fa" font-size="14">❯</text>
  <text x="42" y="365" fill="#cdd6f4" font-size="14">/status</text>
  <text x="102" y="365" fill="#89b4fa" font-size="14">▌</text>

  <!-- Bottom status hint -->
  <text x="630" y="365" fill="#585b70" font-size="11">Tab to complete</text>
</svg>
